<h2>底部控制栏 — 放什么按钮？</h2>
<p class="subtitle">底部栏高度与顶部一样 52px。相机 APP 本质是预览，不需要拍照（摄像头是给 AI 脚本用的输入源）。请选择底部栏的按钮组合：</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>仅返回按钮</h3>
      <p>底部中间一个返回图标/文字，点击回到主菜单。最简洁。适合纯预览用途。</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>返回 + 分辨率切换</h3>
      <p>左返回 + 右分辨率切换（VGA / QVGA 切换）。提供预览画质选项。</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>返回 + FPS 显示</h3>
      <p>底部中间显示实时帧率（FPS），右侧返回按钮。有性能反馈，方便调试。</p>
    </div>
  </div>
  <div class="option" data-choice="d" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>你自己设计</h3>
      <p>告诉我你想要什么按钮/功能，我来帮你设计布局。</p>
    </div>
  </div>
</div>

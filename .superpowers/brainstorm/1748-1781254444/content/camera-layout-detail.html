<h2>相机 APP 布局 — 你描述的结构</h2>
<p class="subtitle">顶栏 52px + 底栏 52px，中间相机预览区域 640×376</p>

<div class="mockup">
  <div class="mockup-header">640×480 屏幕布局</div>
  <div class="mockup-body">
    <div style="background:#111;width:640px;height:480px;position:relative;font-family:sans-serif;">

      <!-- 顶栏 52px -->
      <div style="background:#1a1a1a;height:52px;display:flex;align-items:center;padding:0 8px;position:relative;">
        <div style="color:#ccc;font-size:18px;width:48px;text-align:center;line-height:48px;border-radius:8px;">←</div>
        <div style="color:#fff;font-size:16px;position:absolute;left:50%;transform:translateX(-50%);">相机</div>
      </div>

      <!-- 相机预览区域 640×376 -->
      <div style="background:#1a3a1a;height:376px;display:flex;align-items:center;justify-content:center;color:#4a7a4a;font-size:14px;">
        相机预览 640×376
      </div>

      <!-- 底栏 52px -->
      <div style="background:#1a1a1a;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;">
        <div style="color:#ccc;font-size:14px;text-align:center;width:60px;">🖼 图库</div>
        <div style="width:56px;height:56px;border-radius:50%;border:3px solid #fff;background:transparent;flex-shrink:0;"></div>
        <div style="color:#ccc;font-size:14px;text-align:center;width:60px;">⚙ 模式</div>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <h3>布局参数</h3>
  <table style="width:100%;border-collapse:collapse;color:#ccc;">
    <tr style="border-bottom:1px solid #333;"><td style="padding:6px 12px;">顶栏</td><td style="padding:6px 12px;">52px，左=返回图标，中=APP 名称</td></tr>
    <tr style="border-bottom:1px solid #333;"><td style="padding:6px 12px;">预览区</td><td style="padding:6px 12px;">640 × 376（自动填充，不缩放）</td></tr>
    <tr style="border-bottom:1px solid #333;"><td style="padding:6px 12px;">底栏</td><td style="padding:6px 12px;">52px，左=图库，中=快门(圆形)，右=模式</td></tr>
  </table>
</div>

<p class="subtitle" style="margin-top:20px;">跟你想的一致吗？</p>

<div class="options">
  <div class="option" data-choice="yes" onclick="toggleSelect(this)">
    <div class="letter">✓</div>
    <div class="content">
      <h3>对，就是这个布局</h3>
    </div>
  </div>
  <div class="option" data-choice="no" onclick="toggleSelect(this)">
    <div class="letter">✗</div>
    <div class="content">
      <h3>需要调整</h3>
      <p>在终端告诉我哪里要改</p>
    </div>
  </div>
</div>
